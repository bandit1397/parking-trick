<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 568" width="400" height="568" role="img" aria-label="출입구 막음 처리 절차" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>출입구 막음 처리 절차</title><rect width="400" height="568" rx="14" fill="#ffffff"/><text x="20" y="34" font-size="19" fill="#1b2433" font-weight="700" text-anchor="start">출입구 막음 처리 절차</text><text x="20" y="56" font-size="13" fill="#5d6879" font-weight="400" text-anchor="start">주차장법 제15조 제3항~제5항, 제19조의3 제5항</text><rect x="12" y="76" width="376" height="82" rx="10" fill="#f2f5f9"/><circle cx="42" cy="117" r="16" fill="#1d4fa3"/><text x="42" y="123" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="70" y="110" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">차주 연락</text><text x="70" y="134" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">차량 연락처·경찰 조회로 직접 연락</text><rect x="336" y="92" width="38" height="24" rx="12" fill="#ffffff" stroke="#1d4fa3"/><text x="355.0" y="109" font-size="12" fill="#1d4fa3" font-weight="700" text-anchor="middle">경찰</text><path d="M42 136 L42 174" stroke="#5d6879" stroke-width="2" fill="none"/><path d="M37 166 L42 174 L47 166" stroke="#5d6879" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="12" y="178" width="376" height="82" rx="10" fill="#f2f5f9"/><circle cx="42" cy="219" r="16" fill="#0f7c74"/><text x="42" y="225" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="70" y="212" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">이동 권고</text><text x="70" y="236" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">안내문·문자·방송 등 기록이 남게</text><rect x="324" y="194" width="50" height="24" rx="12" fill="#ffffff" stroke="#0f7c74"/><text x="349.0" y="211" font-size="12" fill="#0f7c74" font-weight="700" text-anchor="middle">관리자</text><path d="M42 238 L42 276" stroke="#5d6879" stroke-width="2" fill="none"/><path d="M37 268 L42 276 L47 268" stroke="#5d6879" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="12" y="280" width="376" height="82" rx="10" fill="#f2f5f9"/><circle cx="42" cy="321" r="16" fill="#0f7c74"/><text x="42" y="327" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="70" y="314" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">조치 요청</text><text x="70" y="338" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">권고에도 그대로면 구청에 요청</text><rect x="264" y="296" width="110" height="24" rx="12" fill="#ffffff" stroke="#0f7c74"/><text x="319.0" y="313" font-size="12" fill="#0f7c74" font-weight="700" text-anchor="middle">관리자 → 구청</text><path d="M42 340 L42 378" stroke="#5d6879" stroke-width="2" fill="none"/><path d="M37 370 L42 378 L47 370" stroke="#5d6879" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="12" y="382" width="376" height="82" rx="10" fill="#f2f5f9"/><circle cx="42" cy="423" r="16" fill="#8a5a00"/><text x="42" y="429" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="70" y="416" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">이동(견인) · 과태료</text><text x="70" y="440" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">비용은 차 사용자 부담 · 1차 100만원</text><rect x="336" y="398" width="38" height="24" rx="12" fill="#ffffff" stroke="#8a5a00"/><text x="355.0" y="415" font-size="12" fill="#8a5a00" font-weight="700" text-anchor="middle">구청</text><rect x="12" y="488" width="376" height="62" rx="10" fill="#e3ebf8"/><text x="26" y="512" font-size="13.5" fill="#1d4fa3" font-weight="700" text-anchor="start">구청이 설치한 공영주차장은 ②③ 없이</text><text x="26" y="534" font-size="13" fill="#1b2433" font-weight="400" text-anchor="start">운전자가 없으면 구청이 바로 이동 (제15조 제2항 제5호)</text></svg>