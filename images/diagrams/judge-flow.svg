<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620" role="img" aria-label="장소별 판단 순서" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>장소별 판단 순서</title><rect width="400" height="620" rx="14" fill="#ffffff"/><text x="20" y="34" font-size="19" fill="#1b2433" font-weight="700" text-anchor="start">장소별 판단 순서</text><text x="20" y="56" font-size="13" fill="#5d6879" font-weight="400" text-anchor="start">어디에 세웠는지에 따라 법과 처리기관이 다릅니다</text><rect x="12" y="78" width="376" height="128" rx="10" fill="#f2f5f9"/><text x="26" y="104" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">① 도로인가?</text><text x="26" y="125" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">공도, 또는 불특정 다수가 다니는 공개된 곳</text><rect x="26" y="138" width="348" height="54" rx="8" fill="#e3ebf8"/><text x="40" y="160" font-size="14.5" fill="#1d4fa3" font-weight="700" text-anchor="start">도로교통법</text><text x="40" y="181" font-size="13" fill="#1b2433" font-weight="400" text-anchor="start">금지장소면 이동명령·견인</text><rect x="304" y="150" width="58" height="28" rx="14" fill="#1d4fa3"/><text x="333" y="169" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">경찰</text><rect x="12" y="238" width="376" height="128" rx="10" fill="#f2f5f9"/><text x="26" y="264" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">② 주차장인가?</text><text x="26" y="285" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">노외(공영·민영) · 부설(아파트·상가)</text><rect x="26" y="298" width="348" height="54" rx="8" fill="#dcf3f0"/><text x="40" y="320" font-size="14.5" fill="#0f7c74" font-weight="700" text-anchor="start">주차장법 (2026.8.28.)</text><text x="40" y="341" font-size="13" fill="#1b2433" font-weight="400" text-anchor="start">출입구 막음 → 과태료·견인</text><rect x="304" y="310" width="58" height="28" rx="14" fill="#0f7c74"/><text x="333" y="329" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">구청</text><rect x="12" y="398" width="376" height="128" rx="10" fill="#f2f5f9"/><text x="26" y="424" font-size="16" fill="#1b2433" font-weight="700" text-anchor="start">③ 그 밖의 사유지</text><text x="26" y="445" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">공터 · 마당 · 건물 앞 · 사유 통행로</text><rect x="26" y="458" width="348" height="54" rx="8" fill="#fdf0d2"/><text x="40" y="480" font-size="14.5" fill="#8a5a00" font-weight="700" text-anchor="start">행정 제재 없음</text><text x="40" y="501" font-size="13" fill="#1b2433" font-weight="400" text-anchor="start">차주 연락 · 민사 안내</text><rect x="304" y="470" width="58" height="28" rx="14" fill="#8a5a00"/><text x="333" y="489" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">민사</text><path d="M200 208 L200 234" stroke="#5d6879" stroke-width="2" fill="none"/><path d="M195 226 L200 234 L205 226" stroke="#5d6879" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="212" y="228" font-size="12" fill="#5d6879" font-weight="400" text-anchor="start">아니면</text><path d="M200 368 L200 394" stroke="#5d6879" stroke-width="2" fill="none"/><path d="M195 386 L200 394 L205 386" stroke="#5d6879" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="212" y="388" font-size="12" fill="#5d6879" font-weight="400" text-anchor="start">아니면</text><text x="20" y="552" font-size="12.5" fill="#c0392b" font-weight="600" text-anchor="start">고의로 통행·영업 봉쇄 → 일반교통방해·업무방해 검토</text><text x="20" y="574" font-size="12.5" fill="#c0392b" font-weight="600" text-anchor="start">무단주차 차를 막거나 훼손 → 재물손괴 (대법원 2019도13764)</text><text x="20" y="598" font-size="12.5" fill="#5d6879" font-weight="400" text-anchor="start">소방차 전용구역 → 소방서 · 장애인·충전구역 → 구청</text></svg>